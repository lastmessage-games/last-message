<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maps</title>
<link rel="stylesheet" href="app-common.css">
<style>
  .map { position: relative; height: 70%; background:
    linear-gradient(135deg, #1d2b1f 0%, #223324 55%, #1a2a33 100%); overflow: hidden; }
  .map .road { position: absolute; background: #3a3a3c; }
  .map .district {
    position: absolute; color: #bbb; font-size: 14px; background: rgba(0,0,0,.45);
    padding: 6px 10px; border-radius: 10px;
  }
  .map .pin { position: absolute; font-size: 26px; transform: translate(-50%,-100%); }
  .map .pin-lbl { position: absolute; transform: translate(-50%, 6px); background: #fff; color: #000;
    font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .map-note { padding: 16px; font-size: 14px; color: #8e8e93; line-height: 1.7; }
</style>
</head>
<body>
<div class="app">
  <div class="app-head"><h1>Maps</h1></div>
  <div class="app-body" style="padding-bottom:0">
    <div class="map">
      <div class="road" style="top:45%;left:0;right:0;height:10px"></div>
      <div class="road" style="top:0;bottom:0;left:55%;width:10px"></div>
      <div class="district" style="top:12%;left:8%">الزمالك</div>
      <div class="district" style="top:20%;right:8%">مدينة نصر</div>
      <div class="district" style="top:60%;left:10%">المعادي</div>
      <div class="district" style="bottom:10%;right:12%">وسط البلد</div>
      <div class="pin" style="top:48%;left:50%">📍</div>
      <div class="pin-lbl" style="top:48%;left:50%">وسط البلد، القاهرة</div>
    </div>
    <div class="map-note">الخريطة دون اتصال — نسخة محفوظة من القاهرة. أماكن جديدة بتظهر هنا لما تثبّت دليل فيه عنوان.</div>
  </div>
</div>
<script src="app-common.js"></script>
<script>
window.onStory = function () {};
window.onUpdate = function () {};
ready('maps');
</script>
</body>
</html>
